<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TisTalk</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:system-ui,-apple-system;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

/* splash */

#splash{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
backdrop-filter:blur(10px);
}

.logo{
font-size:32px;
font-weight:600;
letter-spacing:2px;
margin-bottom:10px;
animation:fade 1.5s ease;
}

.subtitle{
opacity:.8;
margin-bottom:40px;
animation:fade 2s ease;
}

/* loading bar */

.loader{
width:160px;
height:4px;
background:rgba(255,255,255,.2);
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00c6ff,#0072ff);
animation:load 3s linear forwards;
}

@keyframes load{
0%{width:0}
100%{width:100%}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* iframe */

iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:none;
display:none;
background:white;
}

/* floating button */

.menu{
position:absolute;
bottom:20px;
right:20px;
display:none;
}

.menu button{
border:none;
background:#0072ff;
color:white;
padding:12px 16px;
border-radius:40px;
font-size:14px;
box-shadow:0 6px 15px rgba(0,0,0,.3);
}

</style>

</head>

<body>

<div id="splash">

<div class="logo">
App Smell Pak-Mhen
</div>

<div class="subtitle">
Loading To...Calgate.
</div>

<div class="loader">
<div class="bar"></div>
</div>

</div>

<iframe id="app"></iframe>

<div class="menu">
<button onclick="reload()">Reload</button>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxAHzZ08igRsBxsd_IGoEJJaCxtOoeDBPXvp7JsotY_EXP7aGABb9_rY-bvyZ7iisrb/exec"

setTimeout(()=>{

document.getElementById("splash").style.display="none"

const frame=document.getElementById("app")

frame.style.display="block"

frame.src=URL

document.querySelector(".menu").style.display="block"

},3200)

function reload(){

document.getElementById("app").src=URL+"?v="+Date.now()

}

</script>

</body>
</html>
